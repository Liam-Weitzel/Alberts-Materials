<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="DNA and its building blocks: a nucleotide assembled from phosphate, sugar and base; a single DNA strand; templated polymerization of a new complementary strand; and the double helix formed by two complementary strands">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 600; fill: #1e1c19; }
    .note { font-size: 10.5px; }
    .part { fill: #ffffff; stroke: #cdc6bb; stroke-width: 1.5; }
    .base { fill: #e4efea; stroke: #2f6f5e; stroke-width: 1.5; }
    .base2 { fill: #dbe6f2; stroke: #3d6ea5; stroke-width: 1.5; }
    .rail { stroke: #8b857c; stroke-width: 4; stroke-linecap: round; fill: none; }
    .rail2 { stroke: #a5813a; stroke-width: 4; stroke-linecap: round; fill: none; }
    .bond { stroke: #8b857c; stroke-width: 1.5; stroke-dasharray: 2 3; }
    .dot { fill: #8b857c; }
    .arrow { stroke: #8b857c; stroke-width: 1.4; fill: none; }
    .div { stroke: #cdc6bb; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .part { fill: #1b1e24; stroke: #3a3f49; }
      .base { fill: #1d2c28; stroke: #5eb99c; }
      .base2 { fill: #1c2733; stroke: #8db4dd; }
      .rail { stroke: #7b766e; }
      .rail2 { stroke: #cf9f52; }
      .bond { stroke: #7b766e; }
      .dot { fill: #7b766e; }
      .arrow { stroke: #7b766e; }
      .div { stroke: #3a3f49; }
    }
  </style>
  <defs>
    <marker id="n2h" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#8b857c"/>
    </marker>
  </defs>

  <line class="div" x1="440" y1="10" x2="440" y2="490"/>
  <line class="div" x1="10" y1="250" x2="870" y2="250"/>

  <!-- (A) nucleotide -->
  <text class="label" x="10" y="20">(A) a nucleotide</text>
  <circle class="dot" cx="35" cy="90" r="4"/>
  <text class="note" x="18" y="72">phosphate</text>
  <line x1="35" y1="90" x2="65" y2="90" class="bond"/>
  <rect class="part" x="65" y="70" width="55" height="40" rx="6"/>
  <text class="note" x="75" y="94">sugar</text>
  <text class="note" x="128" y="94" style="font-size:14px">+</text>
  <rect class="base" x="150" y="68" width="60" height="44" rx="6"/>
  <text class="note" x="163" y="94">base</text>
  <path class="arrow" d="M218,90 L255,90" marker-end="url(#n2h)"/>
  <circle class="dot" cx="280" cy="90" r="4"/>
  <rect class="part" x="292" y="80" width="40" height="24" rx="5"/>
  <rect class="base" x="332" y="76" width="55" height="32" rx="5"/>
  <text class="note" x="270" y="130">nucleotide</text>
  <text class="note" x="15" y="150">phosphate + sugar + one of four bases</text>
  <text class="note" x="15" y="166">(adenine, guanine, cytosine or thymine)</text>

  <!-- (B) DNA strand -->
  <text class="label" x="460" y="20">(B) a DNA strand</text>
  <line x1="480" y1="80" x2="820" y2="80" class="rail"/>
  <rect class="base" x="495" y="60" width="26" height="16" rx="3"/>
  <text class="note" x="500" y="72" style="font-size:10px">G</text>
  <rect class="base" x="545" y="60" width="26" height="16" rx="3"/>
  <text class="note" x="551" y="72" style="font-size:10px">T</text>
  <rect class="base" x="595" y="60" width="26" height="16" rx="3"/>
  <text class="note" x="601" y="72" style="font-size:10px">A</text>
  <rect class="base" x="645" y="60" width="26" height="16" rx="3"/>
  <text class="note" x="651" y="72" style="font-size:10px">A</text>
  <rect class="base" x="695" y="60" width="26" height="16" rx="3"/>
  <text class="note" x="701" y="72" style="font-size:10px">C</text>
  <rect class="base" x="745" y="60" width="26" height="16" rx="3"/>
  <text class="note" x="751" y="72" style="font-size:10px">G</text>
  <text class="note" x="460" y="120">nucleotides joined by sugar-phosphate</text>
  <text class="note" x="460" y="136">linkages; the backbone has a direction,</text>
  <text class="note" x="460" y="152">read the same way every time.</text>

  <!-- (C) templated polymerization -->
  <text class="label" x="10" y="270">(C) templated polymerization of a new strand</text>
  <line x1="30" y1="300" x2="330" y2="300" class="rail"/>
  <rect class="base" x="45" y="292" width="22" height="14" rx="3"/>
  <text x="52" y="303" style="font-size:9px">G</text>
  <rect class="base" x="80" y="292" width="22" height="14" rx="3"/>
  <text x="87" y="303" style="font-size:9px">T</text>
  <rect class="base" x="115" y="292" width="22" height="14" rx="3"/>
  <text x="122" y="303" style="font-size:9px">A</text>
  <rect class="base" x="150" y="292" width="22" height="14" rx="3"/>
  <text x="157" y="303" style="font-size:9px">A</text>
  <rect class="base" x="185" y="292" width="22" height="14" rx="3"/>
  <text x="192" y="303" style="font-size:9px">C</text>
  <rect class="base" x="220" y="292" width="22" height="14" rx="3"/>
  <text x="227" y="303" style="font-size:9px">G</text>
  <text class="note" x="30" y="285" style="font-size:9.5px">template</text>

  <circle class="dot" cx="260" cy="340" r="3"/>
  <rect class="base2" x="270" y="335" width="20" height="12" rx="2"/>
  <text x="275" y="345" style="font-size:8px">C</text>
  <circle class="dot" cx="200" cy="355" r="3"/>
  <rect class="base2" x="210" y="350" width="20" height="12" rx="2"/>
  <text x="215" y="360" style="font-size:8px">G</text>
  <path class="arrow" d="M280,347 C 240,365 150,375 100,362" marker-end="url(#n2h)"/>
  <text class="note" x="235" y="335" style="font-size:9.5px">free nucleotides</text>

  <line x1="45" y1="299" x2="56" y2="378" class="bond"/>
  <line x1="80" y1="299" x2="91" y2="378" class="bond"/>
  <line x1="115" y1="299" x2="126" y2="378" class="bond"/>
  <line x1="150" y1="299" x2="161" y2="378" class="bond"/>
  <line x1="185" y1="299" x2="196" y2="378" class="bond"/>
  <path class="rail" d="M45,384 Q90,392 135,384 T225,384"/>
  <rect class="base2" x="46" y="376" width="22" height="14" rx="3"/>
  <text x="53" y="387" style="font-size:9px">C</text>
  <rect class="base2" x="80" y="376" width="22" height="14" rx="3"/>
  <text x="87" y="387" style="font-size:9px">A</text>
  <rect class="base2" x="115" y="376" width="22" height="14" rx="3"/>
  <text x="122" y="387" style="font-size:9px">T</text>
  <rect class="base2" x="150" y="376" width="22" height="14" rx="3"/>
  <text x="157" y="387" style="font-size:9px">T</text>
  <rect class="base2" x="185" y="376" width="22" height="14" rx="3"/>
  <text x="192" y="387" style="font-size:9px">G</text>
  <text class="note" x="240" y="392" style="font-size:9.5px">new strand</text>
  <text class="note" x="10" y="425">The template's sequence dictates the new strand's sequence,</text>
  <text class="note" x="10" y="440">base by base, giving a strand complementary to the original.</text>

  <!-- (D) double helix -->
  <text class="label" x="460" y="270">(D) the double helix</text>
  <path class="rail" d="M480,290 C 520,310 520,330 480,350 C 440,370 440,390 480,410 C 520,430 520,450 480,470"/>
  <path class="rail2" d="M540,290 C 500,310 500,330 540,350 C 580,370 580,390 540,410 C 500,430 500,450 540,470"/>
  <line class="bond" x1="486" y1="296" x2="534" y2="296"/>
  <line class="bond" x1="470" y1="322" x2="550" y2="322"/>
  <line class="bond" x1="464" y1="350" x2="556" y2="350"/>
  <line class="bond" x1="470" y1="378" x2="550" y2="378"/>
  <line class="bond" x1="486" y1="404" x2="534" y2="404"/>
  <line class="bond" x1="470" y1="432" x2="550" y2="432"/>
  <line class="bond" x1="486" y1="458" x2="534" y2="458"/>
  <text class="note" x="600" y="320">Hydrogen bonds between</text>
  <text class="note" x="600" y="335">base pairs are weak; the</text>
  <text class="note" x="600" y="350">sugar-phosphate backbones</text>
  <text class="note" x="600" y="365">(covalent) are strong. The</text>
  <text class="note" x="600" y="380">two strands twist around</text>
  <text class="note" x="600" y="395">each other into a helix that</text>
  <text class="note" x="600" y="410">accepts any base sequence.</text>
</svg>
