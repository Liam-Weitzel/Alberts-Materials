<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Life as an autocatalytic process. Panel A: a cell takes in food, uses it to build more of its own collection of catalysts, and discards waste. Panel B: DNA and RNA provide sequence information used to build proteins, and proteins provide the catalytic activity needed to build DNA, RNA and more protein, closing the loop.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 600; fill: #1e1c19; }
    .note { font-size: 10.5px; }
    .box { fill: #efe3cf; stroke: #a5813a; stroke-width: 1.5; }
    .cellA { fill: none; stroke: #8b857c; stroke-width: 2; }
    .cat-dot { fill: #a5443d; }
    .arrow { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    .div { stroke: #cdc6bb; stroke-width: 1; }
    .infoPath { stroke: #2f6f5e; stroke-width: 2; fill: none; }
    .catPath { stroke: #a5443d; stroke-width: 2; fill: none; }
    .feedPath { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    .infoHead { fill: #2f6f5e; }
    .catHead { fill: #a5443d; }
    .feedHead { fill: #8b857c; }
    .arrowHead { fill: #8b857c; }
    .infoTxt { font-size: 11px; font-weight: 700; fill: #2f6f5e; }
    .catTxt { font-size: 11px; font-weight: 700; fill: #a5443d; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .box { fill: #2b2418; stroke: #cf9f52; }
      .cellA { stroke: #7b766e; }
      .cat-dot { fill: #e08079; }
      .arrow { stroke: #7b766e; }
      .div { stroke: #3a3f49; }
      .infoPath { stroke: #5eb99c; }
      .catPath { stroke: #e08079; }
      .feedPath { stroke: #7b766e; }
      .infoHead { fill: #5eb99c; }
      .catHead { fill: #e08079; }
      .feedHead { fill: #7b766e; }
      .arrowHead { fill: #7b766e; }
      .infoTxt { fill: #5eb99c; }
      .catTxt { fill: #e08079; }
    }
  </style>
  <defs>
    <marker id="acgInfo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="infoHead" d="M0,0 L6,3 L0,6 z"/>
    </marker>
    <marker id="acgCat" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="catHead" d="M0,0 L6,3 L0,6 z"/>
    </marker>
    <marker id="acgFeed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="feedHead" d="M0,0 L6,3 L0,6 z"/>
    </marker>
    <marker id="aArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="arrowHead" d="M0,0 L6,3 L0,6 z"/>
    </marker>
  </defs>

  <line class="div" x1="290" y1="10" x2="290" y2="410"/>

  <!-- Panel A -->
  <text class="label" x="10" y="20">(A) a self-replicating collection of catalysts</text>
  <path class="arrow" d="M60,60 L100,90" marker-end="url(#aArrow)"/>
  <text class="note" x="20" y="55">food in</text>
  <path class="arrow" d="M190,90 L230,55" marker-end="url(#aArrow)"/>
  <text class="note" x="205" y="50">waste out</text>

  <ellipse class="cellA" cx="150" cy="220" rx="115" ry="140"/>
  <circle class="cat-dot" cx="110" cy="150" r="3"/>
  <circle class="cat-dot" cx="140" cy="140" r="3"/>
  <circle class="cat-dot" cx="170" cy="155" r="3"/>
  <circle class="cat-dot" cx="120" cy="175" r="3"/>
  <circle class="cat-dot" cx="155" cy="180" r="3"/>
  <circle class="cat-dot" cx="185" cy="185" r="3"/>
  <circle class="cat-dot" cx="100" cy="200" r="3"/>
  <circle class="cat-dot" cx="135" cy="205" r="3"/>
  <circle class="cat-dot" cx="170" cy="210" r="3"/>
  <circle class="cat-dot" cx="200" cy="205" r="3"/>
  <circle class="cat-dot" cx="115" cy="230" r="3"/>
  <circle class="cat-dot" cx="150" cy="235" r="3"/>
  <circle class="cat-dot" cx="185" cy="235" r="3"/>
  <circle class="cat-dot" cx="95" cy="250" r="3"/>
  <circle class="cat-dot" cx="130" cy="260" r="3"/>
  <circle class="cat-dot" cx="165" cy="258" r="3"/>
  <circle class="cat-dot" cx="200" cy="245" r="3"/>
  <circle class="cat-dot" cx="120" cy="285" r="3"/>
  <circle class="cat-dot" cx="155" cy="288" r="3"/>
  <circle class="cat-dot" cx="185" cy="278" r="3"/>
  <text class="note" x="70" y="220" text-anchor="middle">cell's collection</text>
  <text class="note" x="70" y="233" text-anchor="middle">of catalysts</text>

  <text class="note" x="20" y="378">The collection of catalysts collaborates</text>
  <text class="note" x="20" y="392">to reproduce the entire collection</text>
  <text class="note" x="20" y="406">before the cell divides.</text>

  <!-- Panel B -->
  <text class="label" x="320" y="20">(B) the autocatalytic cycle</text>

  <rect class="box" x="560" y="20" width="120" height="34" rx="6"/>
  <text class="label" x="570" y="41">DNA and RNA</text>

  <rect class="box" x="760" y="160" width="120" height="34" rx="6"/>
  <text class="label" x="772" y="181">sequence info</text>

  <rect class="box" x="560" y="300" width="120" height="34" rx="6"/>
  <text class="label" x="588" y="321">proteins</text>

  <rect class="box" x="360" y="160" width="120" height="34" rx="6"/>
  <text class="label" x="368" y="181">catalytic activity</text>

  <path class="infoPath" d="M680,35 C 730,50 760,110 800,160" marker-end="url(#acgInfo)"/>
  <path class="infoPath" d="M800,194 C 760,240 720,280 680,308" marker-end="url(#acgInfo)"/>
  <text class="infoTxt" x="705" y="120">carries sequence</text>

  <path class="catPath" d="M560,317 C 510,290 460,240 430,194" marker-end="url(#acgCat)"/>
  <path class="catPath" d="M430,160 C 460,110 500,55 560,38" marker-end="url(#acgCat)"/>
  <text class="catTxt" x="430" y="120">enables catalysis</text>

  <text class="note" x="535" y="10">nucleotides</text>
  <path class="feedPath" d="M540,14 L590,20" marker-end="url(#acgFeed)"/>

  <text class="note" x="715" y="358">amino acids</text>
  <path class="feedPath" d="M710,350 C 680,335 660,325 640,320" marker-end="url(#acgFeed)"/>

  <text class="note" x="320" y="375">DNA and RNA supply sequence information to build proteins;</text>
  <text class="note" x="320" y="389">proteins supply the catalytic activity needed to copy DNA, RNA</text>
  <text class="note" x="320" y="403">and themselves. Together these loops make life autocatalytic.</text>
</svg>
