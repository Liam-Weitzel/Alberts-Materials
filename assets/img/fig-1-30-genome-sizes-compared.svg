<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="Genome sizes compared across major groups of organisms on a log scale, from small bacterial and archaeal genomes to enormously variable protozoan, plant and amphibian genomes, with example species marked">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .title { font-size: 13px; font-weight: 700; fill: #1e1c19; }
    .cat { font-size: 10px; font-weight: 700; fill: #1e1c19; }
    .sp { font-size: 9px; font-style: italic; }
    .axis-lbl { font-size: 9.5px; }
    .axis-title { font-size: 10px; }
    .plot-bg { fill: #efece7; }
    .grid { stroke: #ffffff; stroke-width: 1; }
    .bar { fill: #2f6f5e; }
    .tick { fill: #d9a441; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .title { fill: #e8e6e1; }
      .cat { fill: #e8e6e1; }
      .plot-bg { fill: #1b1e24; }
      .grid { stroke: #14161a; }
      .bar { fill: #5eb99c; }
      .tick { fill: #e0b45c; }
    }
  </style>
  <text class="title" x="10" y="20">Genome sizes compared</text>
  <rect class="plot-bg" x="170.0" y="34.0" width="650.0" height="386.0"/>
  <line class="grid" x1="180.0" y1="34.0" x2="180.0" y2="420.0"/>
  <text class="axis-lbl" x="180.0" y="434.0" text-anchor="middle">10⁵</text>
  <line class="grid" x1="270.0" y1="34.0" x2="270.0" y2="420.0"/>
  <text class="axis-lbl" x="270.0" y="434.0" text-anchor="middle">10⁶</text>
  <line class="grid" x1="360.0" y1="34.0" x2="360.0" y2="420.0"/>
  <text class="axis-lbl" x="360.0" y="434.0" text-anchor="middle">10⁷</text>
  <line class="grid" x1="450.0" y1="34.0" x2="450.0" y2="420.0"/>
  <text class="axis-lbl" x="450.0" y="434.0" text-anchor="middle">10⁸</text>
  <line class="grid" x1="540.0" y1="34.0" x2="540.0" y2="420.0"/>
  <text class="axis-lbl" x="540.0" y="434.0" text-anchor="middle">10⁹</text>
  <line class="grid" x1="630.0" y1="34.0" x2="630.0" y2="420.0"/>
  <text class="axis-lbl" x="630.0" y="434.0" text-anchor="middle">10¹⁰</text>
  <line class="grid" x1="720.0" y1="34.0" x2="720.0" y2="420.0"/>
  <text class="axis-lbl" x="720.0" y="434.0" text-anchor="middle">10¹¹</text>
  <line class="grid" x1="810.0" y1="34.0" x2="810.0" y2="420.0"/>
  <text class="axis-lbl" x="810.0" y="434.0" text-anchor="middle">10¹²</text>
  <text class="axis-title" x="495.0" y="450.0" text-anchor="middle">nucleotide (base) pairs per haploid genome</text>
  <rect class="bar" x="285.8" y="54.0" width="84.4" height="12" rx="6"/>
  <text class="cat" x="165.0" y="64.0" text-anchor="end">BACTERIA</text>
  <rect class="tick" x="328.1" y="51.0" width="3" height="18"/>
  <text class="sp" x="329.6" y="47.0" text-anchor="middle">E. coli</text>
  <rect class="bar" x="242.9" y="96.0" width="90.0" height="12" rx="6"/>
  <text class="cat" x="165.0" y="106.0" text-anchor="end">ARCHAEA</text>
  <rect class="tick" x="304.3" y="93.0" width="3" height="18"/>
  <text class="sp" x="305.8" y="89.0" text-anchor="middle">Halobacterium sp.</text>
  <rect class="bar" x="360.0" y="138.0" width="422.9" height="12" rx="6"/>
  <text class="cat" x="165.0" y="148.0" text-anchor="end">PROTOZOANS</text>
  <rect class="tick" x="391.1" y="135.0" width="3" height="18"/>
  <text class="sp" x="392.6" y="131.0" text-anchor="middle">malarial parasite</text>
  <rect class="tick" x="761.4" y="135.0" width="3" height="18"/>
  <text class="sp" x="762.9" y="131.0" text-anchor="middle">amoeba</text>
  <rect class="bar" x="351.3" y="180.0" width="62.9" height="12" rx="6"/>
  <text class="cat" x="165.0" y="190.0" text-anchor="end">FUNGI</text>
  <rect class="tick" x="367.2" y="177.0" width="3" height="18"/>
  <text class="sp" x="368.7" y="173.0" text-anchor="middle">yeast (S. cerevisiae)</text>
  <rect class="bar" x="450.0" y="222.0" width="297.1" height="12" rx="6"/>
  <text class="cat" x="165.0" y="232.0" text-anchor="end">PLANTS, ALGAE</text>
  <rect class="tick" x="460.2" y="219.0" width="3" height="18"/>
  <text class="sp" x="461.7" y="215.0" text-anchor="middle">Arabidopsis</text>
  <rect class="tick" x="649.2" y="219.0" width="3" height="18"/>
  <text class="sp" x="650.7" y="215.0" text-anchor="middle">wheat</text>
  <rect class="bar" x="422.9" y="264.0" width="70.0" height="12" rx="6"/>
  <text class="cat" x="165.0" y="274.0" text-anchor="end">NEMATODE WORMS</text>
  <rect class="tick" x="448.5" y="261.0" width="3" height="18"/>
  <text class="sp" x="450.0" y="257.0" text-anchor="middle">Caenorhabditis</text>
  <rect class="bar" x="465.8" y="306.0" width="117.1" height="12" rx="6"/>
  <text class="cat" x="165.0" y="316.0" text-anchor="end">CRUSTACEANS, INSECTS</text>
  <rect class="tick" x="471.5" y="303.0" width="3" height="18"/>
  <text class="sp" x="473.0" y="299.0" text-anchor="middle">Drosophila</text>
  <rect class="tick" x="556.9" y="303.0" width="3" height="18"/>
  <text class="sp" x="558.4" y="299.0" text-anchor="middle">shrimp</text>
  <rect class="bar" x="492.9" y="348.0" width="234.2" height="12" rx="6"/>
  <text class="cat" x="165.0" y="358.0" text-anchor="end">AMPHIBIANS, FISHES</text>
  <rect class="tick" x="551.7" y="345.0" width="3" height="18"/>
  <text class="sp" x="553.2" y="341.0" text-anchor="middle">zebrafish</text>
  <rect class="tick" x="582.7" y="345.0" width="3" height="18"/>
  <text class="sp" x="584.2" y="327.0" text-anchor="middle">frog</text>
  <rect class="tick" x="655.6" y="345.0" width="3" height="18"/>
  <text class="sp" x="657.1" y="341.0" text-anchor="middle">newt</text>
  <rect class="bar" x="540.0" y="390.0" width="76.1" height="12" rx="6"/>
  <text class="cat" x="165.0" y="400.0" text-anchor="end">MAMMALS, BIRDS, REPTILES</text>
  <rect class="tick" x="582.7" y="387.0" width="3" height="18"/>
  <text class="sp" x="584.2" y="383.0" text-anchor="middle">human</text>
  <text class="axis-lbl" x="10" y="475.0">Bar length shows the range of genome sizes found within each group; closely related species can vary hugely</text>
  <text class="axis-lbl" x="10" y="489.0">(compare the amphibians/fishes bar), even when they carry similar numbers of protein-coding genes.</text>
</svg>
