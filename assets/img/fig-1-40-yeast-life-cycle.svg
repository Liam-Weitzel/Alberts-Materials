<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" role="img" aria-label="The yeast life cycle: diploid cells proliferate by budding, or under starvation undergo meiosis and sporulation into haploid spores, which hatch into haploid cells that proliferate by budding or mate to restore the diploid state">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 600; fill: #1e1c19; }
    .note { font-size: 10.5px; }
    .dip { fill: #efe3cf; stroke: #a5813a; stroke-width: 1.5; }
    .hap { fill: #e4efea; stroke: #2f6f5e; stroke-width: 1.5; }
    .spore { fill: #dbe6f2; stroke: #3d6ea5; stroke-width: 1.5; }
    .arrow { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .dip { fill: #2b2418; stroke: #cf9f52; }
      .hap { fill: #1d2c28; stroke: #5eb99c; }
      .spore { fill: #1c2733; stroke: #8db4dd; }
      .arrow { stroke: #7b766e; }
    }
  </style>
  <defs>
    <marker id="ylc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8b857c"/>
    </marker>
  </defs>

  <circle class="dip" cx="230" cy="55" r="34"/>
  <text class="note" x="207" y="60">2n</text>
  <path class="arrow" d="M264,40 C 300,20 300,60 268,68" marker-end="url(#ylc)"/>
  <text class="note" x="300" y="35">mitotic budding</text>

  <path class="arrow" d="M230,90 C 230,110 230,120 230,138" marker-end="url(#ylc)"/>
  <text class="label" x="120" y="115">meiosis + sporulation</text>
  <text class="note" x="140" y="128">(triggered by starvation)</text>

  <circle class="spore" cx="210" cy="185" r="16"/>
  <circle class="spore" cx="245" cy="185" r="16"/>
  <circle class="spore" cx="210" cy="215" r="16"/>
  <circle class="spore" cx="245" cy="215" r="16"/>
  <text class="note" x="203" y="189">n</text>
  <text class="note" x="238" y="189">n</text>
  <text class="note" x="203" y="219">n</text>
  <text class="note" x="238" y="219">n</text>
  <text class="note" x="270" y="205">4 haploid spores</text>

  <path class="arrow" d="M228,232 C 228,250 228,260 228,278" marker-end="url(#ylc)"/>
  <text class="note" x="250" y="260">spores hatch</text>

  <circle class="hap" cx="228" cy="320" r="34"/>
  <text class="note" x="220" y="325">n</text>
  <path class="arrow" d="M260,306 C 296,288 296,326 264,332" marker-end="url(#ylc)"/>
  <text class="note" x="296" y="300">mitotic budding</text>

  <path class="arrow" d="M195,340 C 130,380 120,120 195,72" marker-end="url(#ylc)"/>
  <text class="label" x="10" y="380">mating</text>
  <text class="note" x="10" y="393">two haploid cells of</text>
  <text class="note" x="10" y="405">opposite type fuse</text>

  <text class="note" x="10" y="440">Depending on conditions, S. cerevisiae proliferates asexually as</text>
  <text class="note" x="10" y="453">either 2n or n, or reproduces sexually.</text>
</svg>
