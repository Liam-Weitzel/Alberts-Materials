<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Unrooted phylogenetic tree of hemoglobin genes: vertebrates, invertebrates, plants including legumes, and protozoa each form their own separate branch from a shared center, rather than plant hemoglobins nesting inside the animal branch">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 700; fill: #a5443d; letter-spacing: .03em; }
    .note { font-size: 11px; }
    .legume { font-size: 11px; font-weight: 600; fill: #2f6f5e; }
    .branch { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    .hub { fill: #8b857c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e08079; }
      .legume { fill: #5eb99c; }
      .branch { stroke: #7b766e; }
      .hub { fill: #7b766e; }
    }
  </style>

  <circle class="hub" cx="300" cy="260" r="4"/>

  <!-- vertebrates -->
  <path class="branch" d="M300,260 L280,180"/>
  <path class="branch" d="M280,180 L120,140"/>
  <path class="branch" d="M280,180 L160,90"/>
  <path class="branch" d="M280,180 L220,70"/>
  <path class="branch" d="M280,180 L280,60"/>
  <path class="branch" d="M280,180 L330,70"/>
  <path class="branch" d="M280,180 L370,110"/>
  <path class="branch" d="M370,110 L430,90"/>
  <path class="branch" d="M370,110 L430,120"/>
  <path class="branch" d="M370,110 L410,60"/>
  <text class="note" x="60" y="138">Goldfish</text>
  <text class="note" x="110" y="85">Frog</text>
  <text class="note" x="185" y="62">Salamander</text>
  <text class="note" x="262" y="52">Cobra</text>
  <text class="note" x="335" y="62">Chicken</text>
  <text class="note" x="435" y="88">Human</text>
  <text class="note" x="435" y="123">Cow</text>
  <text class="note" x="380" y="52">Rabbit</text>
  <text class="label" x="200" y="30">VERTEBRATES</text>

  <!-- invertebrates -->
  <path class="branch" d="M300,260 L150,260"/>
  <path class="branch" d="M150,260 L55,215"/>
  <path class="branch" d="M150,260 L55,280"/>
  <path class="branch" d="M150,260 L85,325"/>
  <path class="branch" d="M150,260 L140,345"/>
  <text class="note" x="10" y="212">Earthworm</text>
  <text class="note" x="10" y="285">Insect</text>
  <text class="note" x="35" y="340">Clam</text>
  <text class="note" x="105" y="360">Nematode</text>
  <text class="label" x="10" y="395">INVERTEBRATES</text>

  <!-- plants -->
  <path class="branch" d="M300,260 L430,205"/>
  <path class="branch" d="M430,205 L520,150"/>
  <path class="branch" d="M430,205 L545,190"/>
  <path class="branch" d="M430,205 L545,225"/>
  <path class="branch" d="M430,205 L520,255"/>
  <text class="note" x="525" y="148">Barley</text>
  <text class="legume" x="550" y="194">Lotus</text>
  <text class="legume" x="550" y="229">Alfalfa</text>
  <text class="legume" x="525" y="260">Bean</text>
  <text class="label" x="460" y="130">PLANTS</text>
  <text class="note" x="460" y="115">(legumes in green)</text>

  <!-- protozoa -->
  <path class="branch" d="M300,260 L380,335"/>
  <path class="branch" d="M380,335 L425,395"/>
  <path class="branch" d="M380,335 L360,420"/>
  <text class="note" x="430" y="398">Chlamydomonas</text>
  <text class="note" x="330" y="440">Paramecium</text>
  <text class="label" x="395" y="420">PROTOZOA</text>
</svg>
