<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" width="860" height="680" role="img" aria-label="A flow diagram for the evolution of eukaryotic cells: from an ancestral prokaryote, bands flow up into bacteria and archaea; a thin mitochondria band peels from bacteria into archaea to form the single-celled eukaryote; that eukaryote's flow fans into animals, fungi and plants; and a thin chloroplasts band, also peeling from bacteria, merges into the flow reaching plants; bacteria's own flow continues to nonphotosynthetic and photosynthetic bacteria, and archaea's continues to present-day archaea">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .title { font-size: 14px; font-weight: 700; fill: #1e1c19; }
    .node { font-size: 11px; font-weight: 700; fill: #1e1c19; }
    .node-sm { font-size: 9.5px; font-weight: 700; fill: #1e1c19; }
    .flow-lbl { font-size: 11px; font-weight: 700; }
    .note { font-size: 11px; }
    .axis-lbl { font-size: 10.5px; fill: #8b857c; }
    .box { fill: #ffffff; stroke: #8b857c; stroke-width: 1.5; }
    .rib-grey { fill: #d9d3c8; }
    .rib-salmon { fill: #f0c6c1; }
    .rib-green { fill: #a9d3c0; }
    .mito-lbl { fill: #a5443d; }
    .chloro-lbl { fill: #2f6f5e; }
    .axis { stroke: #8b857c; stroke-width: 1.5; }
    .axis-fill { fill: #8b857c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .title { fill: #e8e6e1; }
      .node { fill: #e8e6e1; }
      .node-sm { fill: #e8e6e1; }
      .axis-lbl { fill: #7b766e; }
      .box { fill: #1b1e24; stroke: #7b766e; }
      .rib-grey { fill: #34383f; }
      .rib-salmon { fill: #4a2c29; }
      .rib-green { fill: #204638; }
      .mito-lbl { fill: #e08079; }
      .chloro-lbl { fill: #5eb99c; }
      .axis { stroke: #7b766e; }
      .axis-fill { fill: #7b766e; }
    }
  </style>

  <text class="title" x="10" y="24">A model for the evolution of eukaryotic cells</text>

  <line class="axis" x1="30" y1="655" x2="30" y2="95"/>
  <path d="M30,85 l-7,14 l14,0 z" class="axis-fill"/>
  <text class="axis-lbl" x="10" y="80" transform="rotate(-90 10 80)">time</text>

  <!-- flow ribbons -->
  <path class="rib-grey" d="M335.0,560.0 C335.0,515.0 130.0,515.0 130.0,470.0 L250.0,470.0 C250.0,515.0 445.0,515.0 445.0,560.0 Z"/>
  <path class="rib-grey" d="M335.0,560.0 C335.0,515.0 530.0,515.0 530.0,470.0 L650.0,470.0 C650.0,515.0 445.0,515.0 445.0,560.0 Z"/>
  <path class="rib-grey" d="M156.0,430.0 C156.0,285.0 18.0,285.0 18.0,140.0 L142.0,140.0 C142.0,285.0 224.0,285.0 224.0,430.0 Z"/>
  <path class="rib-grey" d="M170.0,430.0 C170.0,285.0 182.0,285.0 182.0,140.0 L278.0,140.0 C278.0,285.0 210.0,285.0 210.0,430.0 Z"/>
  <path class="rib-salmon" d="M182.0,430.0 C182.0,380.0 578.0,380.0 578.0,330.0 L602.0,330.0 C602.0,380.0 198.0,380.0 198.0,430.0 Z"/>
  <path class="rib-green" d="M182.0,430.0 C182.0,285.0 378.0,285.0 378.0,140.0 L402.0,140.0 C402.0,285.0 198.0,285.0 198.0,430.0 Z"/>
  <path class="rib-grey" d="M550.0,430.0 C550.0,380.0 536.0,380.0 536.0,330.0 L644.0,330.0 C644.0,380.0 630.0,380.0 630.0,430.0 Z"/>
  <path class="rib-grey" d="M570.0,430.0 C570.0,285.0 724.0,285.0 724.0,140.0 L816.0,140.0 C816.0,285.0 610.0,285.0 610.0,430.0 Z"/>
  <path class="rib-salmon" d="M550.0,290.0 C550.0,215.0 474.0,215.0 474.0,140.0 L566.0,140.0 C566.0,215.0 630.0,215.0 630.0,290.0 Z"/>
  <path class="rib-salmon" d="M568.0,290.0 C568.0,215.0 606.0,215.0 606.0,140.0 L694.0,140.0 C694.0,215.0 612.0,215.0 612.0,290.0 Z"/>
  <path class="rib-salmon" d="M574.0,290.0 C574.0,215.0 378.0,215.0 378.0,140.0 L422.0,140.0 C422.0,215.0 606.0,215.0 606.0,290.0 Z"/>

  <text class="flow-lbl mito-lbl" x="345" y="378">mitochondria</text>
  <text class="flow-lbl chloro-lbl" x="235" y="270">chloroplasts</text>

  <!-- nodes -->
  <rect class="box" x="280" y="560" width="220" height="40" rx="6"/>
  <text class="node" x="300" y="584" text-anchor="start">ancestral prokaryote</text>

  <rect class="box" x="125" y="430" width="130" height="40" rx="6"/>
  <text class="node" x="155" y="454">bacteria</text>

  <rect class="box" x="525" y="430" width="130" height="40" rx="6"/>
  <text class="node" x="558" y="454">archaea</text>

  <rect class="box" x="490" y="290" width="200" height="40" rx="6"/>
  <text class="node" x="504" y="314">single-celled eukaryote</text>

  <rect class="box" x="10" y="100" width="140" height="40" rx="6"/>
  <text class="node-sm" x="26" y="116">nonphotosynthetic</text>
  <text class="node-sm" x="60" y="130">bacteria</text>

  <rect class="box" x="165" y="100" width="130" height="40" rx="6"/>
  <text class="node-sm" x="188" y="116">photosynthetic</text>
  <text class="node-sm" x="200" y="130">bacteria</text>

  <rect class="box" x="355" y="100" width="90" height="40" rx="6"/>
  <text class="node" x="374" y="124">plants</text>

  <rect class="box" x="475" y="100" width="90" height="40" rx="6"/>
  <text class="node" x="491" y="124">animals</text>

  <rect class="box" x="605" y="100" width="90" height="40" rx="6"/>
  <text class="node" x="626" y="124">fungi</text>

  <rect class="box" x="725" y="100" width="90" height="40" rx="6"/>
  <text class="node" x="746" y="124">archaea</text>

  <text class="note" x="10" y="625">Mitochondria trace to a single ancient endosymbiosis, an aerobic bacterium engulfed by an</text>
  <text class="note" x="10" y="640">archaeon, shared by every eukaryote alive today. Chloroplasts trace to a separate, later event:</text>
  <text class="note" x="10" y="655">a photosynthetic bacterium taken up by an already-mitochondria-bearing eukaryote.</text>
</svg>
