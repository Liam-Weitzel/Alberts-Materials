<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="A very simple gene regulatory circuit: a gene's regulatory DNA and protein-coding region are transcribed into mRNA and translated into a transcription regulator protein, which feeds back to bind the gene's own regulatory DNA">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 11.5px; font-weight: 600; fill: #1e1c19; }
    .note { font-size: 10.5px; }
    .reg { fill: #efe3cf; stroke: #a5813a; stroke-width: 1.5; }
    .coding { fill: #f0d3d0; stroke: #a5443d; stroke-width: 1.5; }
    .rail { fill: #cdc6bb; }
    .rna { fill: #dbe6f2; stroke: #3d6ea5; stroke-width: 1.5; }
    .prot { fill: #e4efea; stroke: #2f6f5e; stroke-width: 1.5; }
    .arrow { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .reg { fill: #2b2418; stroke: #cf9f52; }
      .coding { fill: #2c1c1a; stroke: #e08079; }
      .rail { fill: #3a3f49; }
      .rna { fill: #1c2733; stroke: #8db4dd; }
      .prot { fill: #1d2c28; stroke: #5eb99c; }
      .arrow { stroke: #7b766e; }
    }
  </style>
  <defs>
    <marker id="grc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8b857c"/>
    </marker>
  </defs>

  <rect class="rail" x="60" y="40" width="360" height="6"/>
  <rect class="reg" x="60" y="34" width="160" height="18" rx="3"/>
  <rect class="coding" x="220" y="34" width="160" height="18" rx="3"/>
  <text class="label" x="70" y="26">regulatory DNA</text>
  <text class="label" x="290" y="26">protein-coding region</text>

  <path class="arrow" d="M300,52 L300,90" marker-end="url(#grc)"/>
  <rect class="rna" x="240" y="96" width="120" height="14" rx="3"/>
  <text class="label" x="370" y="107">mRNA</text>

  <path class="arrow" d="M300,110 L300,160" marker-end="url(#grc)"/>
  <ellipse class="prot" cx="300" cy="185" rx="30" ry="22"/>
  <text class="label" x="345" y="180">transcription</text>
  <text class="label" x="345" y="194">regulator protein</text>

  <path class="arrow" d="M270,195 C 150,230 90,140 130,52" marker-end="url(#grc)"/>

  <text class="note" x="20" y="260">The protein this gene encodes binds back to its own regulatory DNA and</text>
  <text class="note" x="20" y="274">controls its own transcription: a one-gene feedback loop. Even this simple</text>
  <text class="note" x="20" y="288">circuit can settle into a steady state, act as a switch, or oscillate, depending</text>
  <text class="note" x="20" y="302">on parameters that a diagram like this one doesn't specify.</text>
</svg>
