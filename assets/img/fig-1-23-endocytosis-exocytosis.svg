<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Endocytosis pinches material into the cell as a vesicle, exocytosis fuses a vesicle with the membrane to release material outside">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 600; fill: #1e1c19; }
    .note { font-size: 11px; }
    .mem { fill: none; stroke: #8b857c; stroke-width: 3; stroke-linecap: round; }
    .ves { fill: #e4efea; stroke: #2f6f5e; stroke-width: 1.5; }
    .cargo { fill: #a5443d; }
    .arrow { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .mem { stroke: #7b766e; }
      .ves { fill: #1d2c28; stroke: #5eb99c; }
      .cargo { fill: #e08079; }
      .arrow { stroke: #7b766e; }
    }
  </style>
  <defs>
    <marker id="eeh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8b857c"/>
    </marker>
  </defs>

  <text class="note" x="10" y="18">extracellular space</text>
  <text class="note" x="10" y="245">cytosol</text>

  <text class="label" x="60" y="45">ENDOCYTOSIS</text>
  <path class="mem" d="M20,90 H140 q20,0 20,20 q0,20 20,20 q20,0 20,-20 q0,-20 20,-20 H320"/>
  <circle class="cargo" cx="180" cy="70" r="4"/>
  <circle class="cargo" cx="195" cy="65" r="4"/>
  <path class="arrow" d="M180,140 q0,25 0,45" marker-end="url(#eeh)"/>
  <circle class="ves" cx="180" cy="200" r="20"/>
  <circle class="cargo" cx="175" cy="196" r="3.5"/>
  <circle class="cargo" cx="186" cy="204" r="3.5"/>
  <text class="note" x="215" y="205">vesicle carries cargo inward</text>

  <line x1="330" y1="10" x2="330" y2="250" stroke="#cdc6bb" stroke-width="1"/>

  <text class="label" x="440" y="45">EXOCYTOSIS</text>
  <circle class="ves" cx="440" cy="150" r="20"/>
  <circle class="cargo" cx="435" cy="146" r="3.5"/>
  <circle class="cargo" cx="446" cy="154" r="3.5"/>
  <path class="arrow" d="M440,130 q0,-15 0,-30" marker-end="url(#eeh)"/>
  <path class="mem" d="M330,90 H400 q20,0 20,-8 q20,8 20,0 q20,-8 20,0 q20,8 20,-8 H620"/>
  <circle class="cargo" cx="445" cy="72" r="4"/>
  <circle class="cargo" cx="460" cy="68" r="4"/>
  <text class="note" x="480" y="80">cargo released outside</text>
</svg>
