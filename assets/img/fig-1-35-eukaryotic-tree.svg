  <line class="branch wr" x1="300" y1="250" x2="422.8" y2="139.7"/>
  <line class="branch wr" x1="300" y1="250" x2="399.2" y2="177.3"/>
  <line class="branch wr" x1="300" y1="250" x2="446.9" y2="179.2"/>
  <line class="branch wr" x1="300" y1="250" x2="423.7" y2="209.5"/>
  <line class="branch wr" x1="300" y1="250" x2="411.1" y2="233.9"/>
  <line class="branch wr" x1="300" y1="250" x2="431.1" y2="244.3"/>
  <line class="branch wb" x1="300" y1="250" x2="420.2" y2="255.2"/>
  <line class="branch wb" x1="300" y1="250" x2="456.4" y2="276.9"/>
  <line class="branch wb" x1="300" y1="250" x2="435.5" y2="290.8"/>
  <line class="branch wb" x1="300" y1="250" x2="414.5" y2="309.0"/>
  <line class="branch wb" x1="300" y1="250" x2="392.6" y2="313.6"/>
  <line class="branch wb" x1="300" y1="250" x2="395.8" y2="328.3"/>
  <line class="branch wt" x1="300" y1="250" x2="390.2" y2="355.2"/>
  <line class="branch wt" x1="300" y1="250" x2="383.5" y2="368.2"/>
  <line class="branch wt" x1="300" y1="250" x2="355.9" y2="361.1"/>
  <line class="branch wt" x1="300" y1="250" x2="343.2" y2="392.2"/>
  <line class="branch wt" x1="300" y1="250" x2="330.2" y2="389.4"/>
  <line class="branch wt" x1="300" y1="250" x2="309.7" y2="417.3"/>
  <line class="branch wm" x1="300" y1="250" x2="289.5" y2="379.0"/>
  <line class="branch wm" x1="300" y1="250" x2="273.3" y2="361.4"/>
  <line class="branch wm" x1="300" y1="250" x2="252.8" y2="394.3"/>
  <line class="branch wm" x1="300" y1="250" x2="243.9" y2="373.2"/>
  <line class="branch wm" x1="300" y1="250" x2="222.3" y2="375.9"/>
  <line class="branch wm" x1="300" y1="250" x2="199.0" y2="360.2"/>
  <line class="branch wa" x1="300" y1="250" x2="199.3" y2="333.3"/>
  <line class="branch wa" x1="300" y1="250" x2="179.3" y2="328.8"/>
  <line class="branch wa" x1="300" y1="250" x2="179.9" y2="308.6"/>
  <line class="branch wa" x1="300" y1="250" x2="143.4" y2="296.8"/>
  <line class="branch wa" x1="300" y1="250" x2="153.9" y2="278.3"/>
  <line class="branch wa" x1="300" y1="250" x2="146.2" y2="265.4"/>
  <line class="branch wb" x1="300" y1="250" x2="126.3" y2="237.2"/>
  <line class="branch wb" x1="300" y1="250" x2="178.1" y2="222.8"/>
  <line class="branch wb" x1="300" y1="250" x2="160.6" y2="204.9"/>
  <line class="branch wb" x1="300" y1="250" x2="177.6" y2="196.1"/>
  <line class="branch wb" x1="300" y1="250" x2="203.1" y2="188.5"/>
  <line class="branch wb" x1="300" y1="250" x2="177.0" y2="149.4"/>
  <line class="branch wl" x1="300" y1="250" x2="213.0" y2="155.1"/>
  <line class="branch wl" x1="300" y1="250" x2="207.5" y2="117.0"/>
  <line class="branch wl" x1="300" y1="250" x2="235.5" y2="132.8"/>
  <line class="branch wl" x1="300" y1="250" x2="250.0" y2="98.7"/>
  <line class="branch wl" x1="300" y1="250" x2="274.4" y2="89.9"/>
  <line class="branch wl" x1="300" y1="250" x2="289.0" y2="113.0"/>

  <text class="label" x="220" y="45">Archaeplastida</text>
  <text class="note" x="230" y="90">red algae, mosses,</text>
  <text class="note" x="230" y="103">flowering plants</text>

  <text class="label" x="440" y="90">Opisthokonts</text>
  <text class="note" x="410" y="150">animals, fungi</text>

  <text class="label" x="490" y="255">Excavates</text>
  <text class="note" x="430" y="280">Giardia, Euglena</text>

  <text class="label" x="440" y="415">Alveolates</text>
  <text class="note" x="395" y="365">ciliates</text>

  <text class="label" x="260" y="458">Stramenopiles</text>
  <text class="note" x="270" y="410">diatoms</text>

  <text class="label" x="55" y="415">Rhizaria</text>
  <text class="note" x="150" y="365">foraminifera</text>

  <text class="label" x="15" y="255">Amoebozoa</text>
  <text class="note" x="130" y="280">amoebae, slime molds</text>

  <text class="label" x="60" y="90">Haptophytes</text>

  <text class="cap" x="10" y="495">Animals and plants sit on opposite sides of this tree, separated by many single-celled</text>
  <text class="cap" x="10" y="509">lineages, which is why multicellularity is thought to have arisen independently more than once.</text>
</svg>
