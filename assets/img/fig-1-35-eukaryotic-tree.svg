<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" width="560" height="530" role="img" aria-label="A eukaryotic tree of life based on genome comparisons, showing eight major supergroups: Archaeplastida, Haptophytes, Alveolates, Stramenopiles, Rhizaria, Amoebozoa, Excavates and Opisthokonts (animals and fungi), with animals and plants separated by many single-celled lineages">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 700; fill: #1e1c19; }
    .note { font-size: 10px; font-style: italic; }
    .cap { font-size: 10.5px; font-style: normal; }
    .spoke { stroke: #ffffff; stroke-width: 1.2; opacity: .6; }
    .wg { fill: #bcd9cd; }
    .wr { fill: #f0d3d0; }
    .wb { fill: #dbe6f2; }
    .wt { fill: #cfe8e2; }
    .wm { fill: #dcefe0; }
    .wa { fill: #efe3cf; }
    .wl { fill: #e6dcf2; }
    .branch { stroke-width: 1; fill: none; opacity: .6; }
    .branch.wg { stroke: #5c8a6e; }
    .branch.wr { stroke: #c07068; }
    .branch.wb { stroke: #5c85b8; }
    .branch.wt { stroke: #3d8a78; }
    .branch.wm { stroke: #4a9260; }
    .branch.wa { stroke: #a5813a; }
    .branch.wl { stroke: #8265a8; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .spoke { stroke: #14161a; opacity: .8; }
      .wg { fill: #1d2c28; }
      .wr { fill: #2c1c1a; }
      .wb { fill: #1c2733; }
      .wt { fill: #17332c; }
      .wm { fill: #17291c; }
      .wa { fill: #2b2418; }
      .wl { fill: #241f33; }
      .branch { opacity: .7; }
      .branch.wg { stroke: #5eb99c; }
      .branch.wr { stroke: #e08079; }
      .branch.wb { stroke: #8db4dd; }
      .branch.wt { stroke: #6fd0ba; }
      .branch.wm { stroke: #7cc491; }
      .branch.wa { stroke: #cf9f52; }
      .branch.wl { stroke: #b79ddb; }
    }
  </style>

  <text class="label" x="10" y="20" style="font-size:13px">A eukaryotic tree of life, by supergroup</text>

  <polygon class="wg" points="300,250 300,65 431,119"/>
  <polygon class="wr" points="300,250 431,119 485,250"/>
  <polygon class="wb" points="300,250 485,250 431,381"/>
  <polygon class="wt" points="300,250 431,381 300,435"/>
  <polygon class="wm" points="300,250 300,435 169,381"/>
  <polygon class="wa" points="300,250 169,381 115,250"/>
  <polygon class="wb" points="300,250 115,250 169,119"/>
  <polygon class="wl" points="300,250 169,119 300,65"/>

  <g class="spoke">
    <line x1="300" y1="250" x2="300" y2="65"/>
    <line x1="300" y1="250" x2="431" y2="119"/>
    <line x1="300" y1="250" x2="485" y2="250"/>
    <line x1="300" y1="250" x2="431" y2="381"/>
    <line x1="300" y1="250" x2="300" y2="435"/>
    <line x1="300" y1="250" x2="169" y2="381"/>
    <line x1="300" y1="250" x2="115" y2="250"/>
    <line x1="300" y1="250" x2="169" y2="119"/>
  </g>

  <line class="branch wg" x1="300" y1="250" x2="305.5" y2="127.8"/>
  <line class="branch wg" x1="300" y1="250" x2="322.7" y2="140.0"/>
  <line class="branch wg" x1="300" y1="250" x2="341.2" y2="128.6"/>
