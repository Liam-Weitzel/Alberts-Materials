<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="Two types of gene homology. Orthologs: an ancestral organism's gene is separated into two species by speciation. Paralogs: a gene is duplicated within one organism and the two copies diverge by gene duplication."
>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #56514a; }
    .label { font-size: 12px; font-weight: 600; fill: #1e1c19; }
    .note { font-size: 11px; }
    .proc { font-size: 9.5px; font-weight: 600; fill: #56514a; }
    .box { fill: #ffffff; stroke: #cdc6bb; stroke-width: 1.5; }
    .orgbox { fill: #f3f1ec; stroke: #8b857c; stroke-width: 1.3; }
    .gene { fill: #e4efea; stroke: #2f6f5e; stroke-width: 1.5; }
    .gene2 { fill: #efe3cf; stroke: #a5813a; stroke-width: 1.5; }
    .arrow { stroke: #8b857c; stroke-width: 1.5; fill: none; }
    .tag { font-size: 11px; font-weight: 600; fill: #2f6f5e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a9a49c; }
      .label { fill: #e8e6e1; }
      .proc { fill: #a9a49c; }
      .box { fill: #1b1e24; stroke: #3a3f49; }
      .orgbox { fill: #1e2126; stroke: #7b766e; }
      .gene { fill: #1d2c28; stroke: #5eb99c; }
      .gene2 { fill: #2b2418; stroke: #cf9f52; }
      .arrow { stroke: #7b766e; }
      .tag { fill: #5eb99c; }
    }
  </style>
  <defs>
    <marker id="opa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8b857c"/>
    </marker>
  </defs>

  <text class="label" x="10" y="20">(A) orthologs: separated by speciation</text>

  <rect class="orgbox" x="55" y="30" width="110" height="50" rx="8"/>
  <text class="note" x="65" y="44">ancestral organism</text>
  <rect class="gene" x="75" y="52" width="70" height="20" rx="4"/>
  <text class="note" x="98" y="66">gene G</text>

  <text class="proc" x="30" y="102">speciation to give</text>
  <text class="proc" x="30" y="113">two separate species</text>
  <path class="arrow" d="M95,80 L45,128" marker-end="url(#opa)"/>
  <path class="arrow" d="M125,80 L175,128" marker-end="url(#opa)"/>

  <rect class="orgbox" x="10" y="130" width="90" height="50" rx="8"/>
  <text class="note" x="20" y="144">species A</text>
  <rect class="gene" x="20" y="152" width="70" height="20" rx="4"/>
  <text class="note" x="35" y="166">gene G_A</text>

  <rect class="orgbox" x="140" y="130" width="90" height="50" rx="8"/>
  <text class="note" x="150" y="144">species B</text>
  <rect class="gene" x="150" y="152" width="70" height="20" rx="4"/>
  <text class="note" x="165" y="166">gene G_B</text>

  <text class="tag" x="20" y="215">genes G_A and G_B are orthologs</text>
  <text class="note" x="20" y="234">same job, different species</text>

  <line x1="335" y1="10" x2="335" y2="290" stroke="#cdc6bb" stroke-width="1"/>

  <text class="label" x="365" y="20">(B) paralogs: separated by gene duplication</text>

  <rect class="orgbox" x="390" y="30" width="110" height="50" rx="8"/>
  <text class="note" x="400" y="44">ancestral organism</text>
  <rect class="gene" x="410" y="52" width="70" height="20" rx="4"/>
  <text class="note" x="433" y="66">gene G</text>

  <text class="proc" x="365" y="102">gene duplication</text>
  <text class="proc" x="365" y="113">and divergence</text>
  <path class="arrow" d="M445,80 L445,128" marker-end="url(#opa)"/>

  <rect class="orgbox" x="385" y="130" width="120" height="80" rx="8"/>
  <text class="note" x="395" y="144">later organism</text>
  <rect class="gene" x="400" y="152" width="90" height="20" rx="4"/>
  <text class="note" x="420" y="166">gene G1</text>
  <rect class="gene2" x="400" y="180" width="90" height="20" rx="4"/>
  <text class="note" x="420" y="194">gene G2</text>

  <text class="tag" x="365" y="245">genes G1 and G2 are paralogs</text>
  <text class="note" x="365" y="264">same genome, diverging functions</text>

  <text class="note" x="10" y="290">Homologs: any genes descended from a shared ancestral gene, by either route.</text>
</svg>
